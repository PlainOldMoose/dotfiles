# Black + red, OLED-black background
font_family      JetBrainsMono Nerd Font
font_size        11.5
window_padding_width 12
hide_window_decorations no
confirm_os_window_close 0
cursor_shape beam
cursor_trail 0
tab_bar_style powerline
tab_powerline_style slanted
enable_audio_bell no
# 1.0 keeps OLED pixels off; try 0.85 + background_blur 32 for glass look
background_opacity 0.85
background_blur 32

foreground #dcdcdc
background #000000
selection_foreground #ffffff
selection_background #6b0f15
url_color #f8505a
cursor #e11d2a
cursor_text_color #000000
active_tab_foreground #000000
active_tab_background #e11d2a
inactive_tab_foreground #6e6e6e
inactive_tab_background #141414
tab_bar_background #000000
active_border_color #e11d2a
inactive_border_color #2a2a2a

color0  #141414
color8  #555555
color1  #ff3b47
color9  #ff6b73
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #e11d2a
color12 #f8505a
color5  #b3134f
color13 #e0457b
color6  #d97a7a
color14 #f0a3a3
color7  #b0b0b0
color15 #e8e8e8
